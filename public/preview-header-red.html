<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Preview header rojo</title>
<style>
  body{margin:0; background:#141414; font-family:'Plus Jakarta Sans',-apple-system,sans-serif;}
  .ticker{background:#161616; color:#fff; font-size:12px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; padding:9px 24px; display:flex; gap:24px;}
  header{background:linear-gradient(150deg,#b2122c 0%,#a50d1e 55%,#8a0a18 100%); padding:28px 24px 22px;}
  .row{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; max-width:1100px; margin:0 auto;}
  .brand{display:flex; align-items:flex-start; gap:16px;}
  .mark{width:64px; height:64px; flex:none;}
  .brand-text h1{margin:0; font-size:26px; font-weight:800; color:#fff;}
  .brand-text p{margin:6px 0 0; font-size:14px; color:rgba(255,255,255,.85);}
  .brand-text b{color:#f9bd00;}
  nav{display:flex; gap:8px; flex-wrap:wrap; align-self:center;}
  nav button, nav a{padding:9px 16px; border-radius:999px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.1); color:#fff; font-weight:700; font-size:13.5px; text-decoration:none; cursor:pointer;}
  .socials{display:flex; gap:10px;}
  .icon-btn{width:40px; height:40px; border-radius:999px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; color:#fff;}
  .search{max-width:1100px; margin:20px auto 0; display:flex; align-items:center; gap:11px; background:rgba(255,255,255,.95); border-radius:999px; padding:15px 20px; color:#8a8a8a; font-size:15px;}
  .chips{max-width:1100px; margin:16px auto 0; display:flex; gap:10px; flex-wrap:wrap;}
  .chips button{padding:10px 18px; border-radius:999px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12); color:#fff; font-weight:700; font-size:13.5px;}
</style>
</head>
<body>
<div class="ticker"><span>PRODUCTOS 100% ORIGINALES</span><span>RESERVA PAGANDO UNA PARTE</span><span>ASESORÍA PERSONALIZADA</span></div>
<header>
  <div class="row">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 100">
        <rect x="30" y="4" width="40" height="92" rx="20" fill="#f9bd00" stroke="#000" stroke-width="5"/>
        <line x1="30" y1="34" x2="70" y2="34" stroke="#000" stroke-width="5"/>
        <line x1="30" y1="50" x2="70" y2="50" stroke="#000" stroke-width="5"/>
        <line x1="30" y1="66" x2="70" y2="66" stroke="#000" stroke-width="5"/>
      </svg>
      <div class="brand-text">
        <h1>La Tienda de Meowth</h1>
        <p>La primera tienda especializada en Pokémon del Perú <b>desde 2007</b>.</p>
      </div>
    </div>
    <nav>
      <button>Quién soy</button><button>Cómo comprar</button><button>Catálogo</button><a href="#">Pokéblog</a><button>Redes</button>
    </nav>
    <div class="socials">
      <div class="icon-btn">🔔</div>
      <div class="icon-btn">☀️</div>
    </div>
  </div>
  <div class="search">🔍&nbsp;&nbsp;¿Qué Pokémon quieres capturar hoy?</div>
</header>
</body>
</html>
