<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Preview opciones rojo en pastillas</title>
<style>
  body{margin:0; background:#fafafc; font-family:'Plus Jakarta Sans',-apple-system,sans-serif;}
  .lbl{font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#a16207; padding:20px 24px 10px;}
  .sec{padding:0 24px 32px; max-width:500px;}
  .bene{display:flex; align-items:center; gap:14px; border-radius:999px; padding:14px 20px; margin-bottom:14px; background:#e9e9ea; box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .ico{width:44px;height:44px;border-radius:999px; display:flex; align-items:center; justify-content:center; flex:none; font-size:18px;}
  .tt{font-size:16px; font-weight:700; color:#1d1d1f;}
  .hl{color:#a16207; font-weight:800;}
  .hl-red{color:#b01818; font-weight:800;}
  /* opción A: solo ícono rojo */
  .a .ico{background:#c81e1e; color:#fff;}
  .a .bene{border:1px solid #dcdcdc;}
  /* opción B: borde rojo sutil */
  .b .ico{background:#f9bd00; color:#3a2e0a;}
  .b .bene{border:1.5px solid rgba(200,30,30,.4);}
  /* opción C: pastilla fondo rojo completo */
  .c .bene{background:linear-gradient(150deg,#b2122c,#8a0a18); border:1px solid rgba(255,255,255,.25);}
  .c .ico{background:#f9bd00; color:#3a2e0a;}
  .c .tt{color:#fff;}
  .c .hl, .c .hl-red{color:#ffd35a;}
</style>
</head>
<body>
<div class="lbl">Opción A — solo ícono en rojo</div>
<div class="sec a">
  <div class="bene"><div class="ico">🛍️</div><div class="tt">Lo quieres, ¡<span class="hl">SEPÁRALO</span> y no lo pierdas!</div></div>
  <div class="bene"><div class="ico">🏠</div><div class="tt">Almacén <span class="hl">GRATIS</span></div></div>
</div>

<div class="lbl">Opción B — pastilla neutra con borde rojo sutil</div>
<div class="sec b">
  <div class="bene"><div class="ico">🛍️</div><div class="tt">Lo quieres, ¡<span class="hl">SEPÁRALO</span> y no lo pierdas!</div></div>
  <div class="bene"><div class="ico">🏠</div><div class="tt">Almacén <span class="hl">GRATIS</span></div></div>
</div>

<div class="lbl">Opción C — pastilla con fondo rojo completo</div>
<div class="sec c">
  <div class="bene"><div class="ico">🛍️</div><div class="tt">Lo quieres, ¡<span class="hl">SEPÁRALO</span> y no lo pierdas!</div></div>
  <div class="bene"><div class="ico">🏠</div><div class="tt">Almacén <span class="hl">GRATIS</span></div></div>
</div>
</body>
</html>
